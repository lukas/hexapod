[project]
name = "hexapod-lab"
version = "0.1.0"
description = "Robot Lab v2: a small closed loop that keeps the hexapod running experiments, plus its web/API/MCP server"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
hexapod-lab = "hexapod_lab2.server:run"
hexapod-lab2 = "hexapod_lab2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexapod_lab2"]

[tool.pytest.ini_options]
testpaths = ["tests_lab2"]
