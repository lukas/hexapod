[project]
name = "hexapod-lab"
version = "0.1.0"
description = "Authenticated experiment queue, recorder, API, MCP server, and results UI for a robot"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
hexapod-lab = "hexapod_lab.main:run"
hexapod-blocker-monitor = "hexapod_lab.blocker_monitor:main"
hexapod-codex-orchestrator = "hexapod_lab.codex_orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
