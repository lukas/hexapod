build:
  id: prototype_sts3215/horn-compression-limiters
  name: STS3215 horn compression-limiter experiment
  status: side-screw experiment
parts:
  femur_link_compression_limiter_test:
    description: "extended femur yoke \u2014 connecting wall 2mm farther out"
    manufacturing: fdm
    output_stl: stl/femur_yoke_2mm_outward.stl
  tibia_knee_yoke_compression_limiter_test:
    description: "Tibia yoke \u2014 closed-back carbon tube socket"
    manufacturing: fdm
    arm_thickness_mm: 7
    output_stl: stl/tibia_yoke_tube_stop.stl
  compression_limiter_fit_coupon:
    description: "horizontal fit coupon: \xD84.65 to \xD84.85; selected \xD84.70"
  metal_compression_limiter:
    description: knee-passive metal limiter 4
  coxa_hub_screw:
    description: "Yaw hub \u2014 M3x12 without washers, 5.8 mm head recesses"
    manufacturing: fdm
    output_stl: stl/yaw_hub_direct_head_seats.stl
  coxa_leg_screw:
    description: "Part B \u2014 hip bracket with flat print face"
  m3_self_tapper:
    description: Four self-tapping screws entering upward through the yaw hub into
      Part B; 10 mm measured under the head
    label: "3 \xD7 10 mm self-tapping screw"
    manufacturing: purchased
    nominal_diameter_mm: 3
    under_head_length_mm: 10
  yaw_compression_spacer:
    description: 'Yaw compression spacer 4: 4.5 OD x 10 mm'
  servo_clamp_cap:
    description: "Coxa top \u2014 hip servo clamp cap"
  heat_set_insert:
    description: M3 heat-set insert, 5 mm long
    printable: false
  m3_top_screw:
    description: M3x8 socket-head screw through lid
    printable: false
  insert_reference:
    description: Separate insert reference, not extra assembly hardware
    printable: false
side_cap:
  lidTranslationMm:
  - 0
  - 0
  - 0
  tabSocketSideClearanceMm: 0.15
  sites:
  - side: -1
    screw: M3x8 SHCS
    nut: M3 AF5.5 x 2.4
    headSeatXmm: -31.700000000000003
    tipXmm: -23.700000000000003
    nutSweepOverlapMm3: 0.0
    bearingFacesVerified: true
  - side: 1
    screw: M3x8 SHCS
    nut: M3 AF5.5 x 2.4
    headSeatXmm: 32.2
    tipXmm: 24.200000000000003
    nutSweepOverlapMm3: 0.0
    bearingFacesVerified: true
  capCradleOverlapMm3: 0
  openNutPockets: true
  driverAccess: true
  servoContactGeometryPreserved: true
  pass: true
assembly:
- Print the socket and lid coupons first.
- Slide M3 nuts into open tab-tip pockets.
- Press the lid fully onto its original seat and start two M3x8 side screws.
- Side screws retain the seated lid; they do not draw it down.
print: Use printMeshId downloads; cap flange-down makes nut pockets open upward.
