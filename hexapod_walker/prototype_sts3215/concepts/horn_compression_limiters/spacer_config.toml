# Edit this file when changing purchased spacers. All dimensions are mm.
#
# `outside_diameter_mm` changes the modeled metal spacer, the printed bore, and
# the fit coupon. The printed bore is spacer OD + the diametral allowance below.
# Physical coupon feedback: 4.60 mm slightly tight, 4.80 mm slightly loose.
# Select the 4.70 mm midpoint; the refined coupon tests 4.65–4.85 mm.
# Because horizontal FDM holes print undersize, treat it as printer compensation,
# not as the physical free play that will remain after printing.

[spacer]
# Set false to generate the normal production parts with no compression spacer,
# no enlarged bore, and no spacer head boss. The dimensions below stay saved.
enabled = true
outside_diameter_mm = 4.50
inside_diameter_mm = 3.20
length_mm = 10.00

[printed_fit]
bore_diametral_allowance_mm = 0.20
coupon_offsets_from_selected_bore_mm = [-0.05, 0.00, 0.05, 0.10, 0.15]
