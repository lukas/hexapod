[bracket]
# User measurements. Recheck with calipers before printing a complete set.
outside_span_mm = 56.0
plate_thickness_mm = 2.10
axis_to_front_outer_mm = 51.0
center_hole_diameter_mm = 8.0

# Matching long-U commodity nominal; this was not supplied in the note.
blade_and_front_width_mm = 25.0

[front]
# Physical bracket measurement (Lukas, 2026-09-02): 34 mm between the inner
# hole edges and 40 mm across the outer edges. The generators derive Ø3.0 mm
# physical holes, 37.0 mm centre spacing, and 9.5 mm edge insets from these.
extra_pair_inner_edge_gap_mm = 34.0
extra_pair_outer_edge_span_mm = 40.0
usual_pattern_pcd_mm = 14.0
# Printed receiver/coupon clearance; intentionally larger than the measured
# Ø3.0 mm holes in the bought bracket.
m3_clearance_diameter_mm = 3.40

# The femur receiver ends at the inherited servo-cavity wall instead of
# projecting into the servo. Six short inserts load from the bracket face.
femur_insert_bore_diameter_mm = 4.60
femur_insert_depth_mm = 3.10
femur_insert_leadin_diameter_mm = 5.10
femur_insert_leadin_depth_mm = 0.60

[tibia_socket]
# Double the original 14 mm captured length so the socket sleeves much more of
# the existing Ø8 carbon tube and reduces its unsupported bending span.
tube_engagement_depth_mm = 30.0

# Four radial U-shaped windows expose the four central captive nylocs without
# removing the complete tube collar at the mouth. The two measured outer-pair
# pockets already sit beyond the ring and need no scallop.
window_width_mm = 6.80
window_beyond_receiver_mm = 0.80

[spacers]
thickness_mm = 7.0
outside_diameter_mm = 21.0
m3_clearance_diameter_mm = 3.40
driven_head_pocket_diameter_mm = 8.8
driven_head_pocket_depth_mm = 2.8
driven_tool_access_diameter_mm = 4.2
passive_center_through_diameter_mm = 8.6

[coxa_support_tower]
# Vertical rear crescent fused into the coxa. Its footprint copies the lower
# yaw hub's circular contour and never exceeds that existing plan envelope.
outer_radius_mm = 19.0
front_chord_x_mm = -10.5
tower_bottom_z_mm = 4.0
tower_top_z_mm = 46.25
cap_flange_bottom_z_mm = 46.30
cap_flange_top_z_mm = 50.40
top_screw_x_mm = -14.0
top_screw_ys_mm = [-6.0, 6.0]
yaw_driver_extra_radial_clearance_mm = 2.0

# Two top-entry M3x8 SHCS through the 5 mm hip-cap flange into heat-set inserts
# in the integral coxa tower. Rotate the assembly for installation access.
m3_clearance_diameter_mm = 3.40
shcs_head_pocket_diameter_mm = 6.20
shcs_head_pocket_depth_mm = 3.0
insert_bore_diameter_mm = 4.60
insert_depth_mm = 5.70
insert_leadin_diameter_mm = 5.10
insert_leadin_depth_mm = 0.80

[coxa_reinforcement]
# The negative-Y side retains separate upper/lower ribs. On positive Y, the
# former pair of long stepped ribs is one full-height rectangular block that
# stops at the servo's rear-retention tab. All three supports retain curved
# roots following the lower R19 yaw-hub contour. The centre of the lower hub
# stays open instead of recreating the old perforated slab.
arm_x0_mm = -13.0
arm_x1_mm = 42.0
curve_x1_mm = 2.0
lower_curve_inner_radius_mm = 17.0
lower_curve_outer_radius_mm = 25.1
lower_straight_center_y_mm = 21.9
upper_curve_inner_radius_mm = 17.0
upper_curve_outer_radius_mm = 25.1
upper_straight_center_y_mm = 21.9
centre_relief_radius_mm = 20.0
straight_width_mm = 4.0
lower_bridge_z0_mm = 4.0
lower_bridge_z1_mm = 10.0
upper_bridge_z0_mm = 27.5
upper_bridge_z1_mm = 35.8
# A single through-axis opens the inherited front-case screw path through the
# remaining negative-Y upper rib. The positive side ends before this axis, so
# that side is open air rather than another bored rail.
upper_screw_access_x_mm = 25.5
upper_screw_access_z_mm = 34.65
upper_screw_access_diameter_mm = 6.5

# The positive-Y pair is replaced by one solid side block. It follows the
# same circular root, then stops at the servo's existing rear-retention tab
# instead of continuing uselessly across the servo. The two tab screws remain
# accessible through straight driver bores in the block.
positive_tab_block_x0_mm = -0.5
positive_tab_block_x1_mm = 23.8
positive_tab_block_y0_mm = 15.65
positive_tab_block_y1_mm = 23.9
positive_tab_block_z0_mm = 4.0
positive_tab_block_z1_mm = 36.7
positive_tab_hole_x_mm = 21.7
positive_tab_hole_zs_mm = [14.2, 34.6]
positive_tab_driver_diameter_mm = 6.8

[coxa_servo_holder_centering]
# The inherited open-face cradle is correctly located on the hip axis, but
# its flat support foot stopped at Y=+16.65 while reaching Y=-23.65 on the
# other side.  Extend only the low foot toward Y=+24.25, which centers its plan
# outline on the seated servo centreline at Y=+0.50.  The servo, horn, cap,
# hip axis, and +Y horn-on extraction opening all stay in their existing
# positions. The solid positive-Y tab block nests inside this footprint.
servo_center_y_mm = 0.50
existing_foot_negative_y_mm = -23.65
existing_foot_positive_y_mm = 16.65
# Exact centering would put the new edge at Y=+24.65. Trim that by 0.40 mm so
# the moving aluminum C bracket at Y=+24.40 retains 0.15 mm model clearance.
# The resulting foot centre is within 0.20 mm of the servo centreline and the
# tab block remains fully inside the outline.
positive_edge_centering_trim_mm = 0.40
foot_x_range_mm = [9.30, 74.70]
foot_z_range_mm = [4.00, 12.00]

[hip_bearing_carrier]
# The upper 6805 pedestal is now a separate flat-backed cartridge. Three
# M3x8 countersunk screws enter from the underside of the flat hip-cap pad
# into short heat-set inserts in the cartridge. The asymmetric triangle stays
# clear of the two existing tower-to-cap screws at X=-14, Y=+/-6.
mount_radius_mm = 19.0
cap_pad_inner_face_y_mm = 17.0
mount_screw_radius_mm = 15.5
mount_screw_angles_deg = [0.0, 97.5, 262.5]
m3_clearance_diameter_mm = 3.40
countersink_major_diameter_mm = 6.50
countersink_depth_mm = 2.0
insert_bore_diameter_mm = 4.60
insert_depth_mm = 3.10
insert_leadin_diameter_mm = 5.10
insert_leadin_depth_mm = 0.60
flange_top_gap_below_bearing_mm = 0.40

[coxa_yaw_hub_split]
# Split the lower yaw bearing/horn hub from the coxa at the existing flat
# underside of the servo-holder slab. Two top-entry M3x8 low-profile SHCS
# land in two small rear-diagonal mounting tongues instead of forming a second
# four-hole pattern around the five horn-driver corridors. The inserts stay
# inside the 25.15 mm bearing press boss and the central plate is removed.
interface_z_mm = 4.0
radial_clearance_mm = 0.10
mount_screw_radius_mm = 9.2
mount_screw_angles_deg = [135.0, 225.0]
m3_clearance_diameter_mm = 3.40
head_pocket_diameter_mm = 5.80
head_pocket_depth_mm = 2.0
insert_bore_diameter_mm = 4.00
insert_depth_mm = 4.00
insert_leadin_diameter_mm = 4.40
insert_leadin_depth_mm = 0.60
