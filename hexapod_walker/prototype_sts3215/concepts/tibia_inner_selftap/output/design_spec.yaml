validation:
  generator: make_premade_chorn_56_variant.py
  generated_report: geometry_report.json
  buildviz_scene: scene.json
  buildviz_checker: current BVH penetration checker with typed, audited, per-instance
    allowedInterferences and no legacy part-type overlap ignores
  required_first_physical_test: front_6hole_fit_coupon.stl
revision_note: 'Tibia socket: replace four inaccessible inner nuts with Ø2.5x7mm blind
  pilots for 3x8 self-tappers; close obsolete nut-access windows. Keep two outer nyloc
  connections, tube fit and all v37 knee improvements. User reports the four inner
  tibia receiver nuts cannot be installed/accessed, then explicitly chooses self-tapping
  screws instead of inserts. Remove only these four nut connections and restore solid
  plastic behind their original 14mm-PCD holes. Screws pass through the metal C web
  and tap the plastic. The two outer accessible nuts remain. Use v37 as the full-robot
  parent: the viewed v5 socket is identical, so earlier knee changes are preserved.
  Plastic threads trade away nut-thread durability and need physical pilot/torque
  fit testing.'
knee_fastening_swap:
  baseline: v36
  reason: 'User requests swapping v36''s fastening types: reusable metal threads at
    the two removable cap screws, and self-tapping plastic pilots at the six metal-C-to-femur
    screws. This removes the incompatible 3.1mm front insert pockets. Retain the longer
    v36 box, cap, all transforms and motion datums. Assume M3 inserts are 5.7mm long
    with 4.6mm knurled OD, as in the prior roof; verify the actual stock. Front plastic
    threads need dry-fit/torque testing and will wear with repeated disassembly.'
  checks:
    baseline: v36
    changed_printed_meshes:
    - femur_ovh_body
    cap_mesh_unchanged: true
    hip_to_knee_mm: 96
    insert_assumption:
      thread: M3
      length_mm: 5.7
      knurled_od_mm: 4.6
    cap_joint:
      per_knee: 2
      screw: M3x8 machine
      pilot_diameter_mm: 4.0
      pilot_depth_mm: 6.7
      nominal_thread_engagement_mm: 5.7
      blind_tip_clearance_mm: 0.7
    front_joint:
      per_knee: 6
      screw: 3x8 self-tapping for plastic
      metal_thickness_mm: 2.1
      pilot_diameter_mm: 2.5
      pilot_depth_mm: 7.0
      plastic_entry_mm: 5.9
      full_diameter_engagement_excluding_tip_mm: 4.9
      blind_tip_clearance_mm: 1.1
      plastic_remaining_behind_pilot_mm: 2.6
    hardware_intersections: []
    cap_box_mm3: 0.0
    servo_box_mm3: 0.0
    cap_metal_mm3: 0.0
    box_metal_mm3: -4.850638409455617e-12
    cap_removal: clear at +Y 0.1,1,2,5,15,35mm with front screws and inserts installed
    tool_access: Ø5 heat-set tip and Ø5.5x50 screwdrivers clear on detached subassembly;
      fasten C web before mounting C to hip servo
    motion:
      hip_deg:
      - -110
      - 30
      knee_deg:
      - -30
      - 20
      step_deg: 2.5
      yaw_samples_deg:
      - -35
      - -20
      - 0
      - 20
      - 35
      horn_on_extraction: clear with 1.5mm radial margin
  assembly: Heat-set two inserts from the cap mating face of the empty detached femur
    box. Attach metal C web with six 3x8 plastic self-tappers before mounting C on
    servo. Install knee servo and unchanged cap with two M3x8 machine screws. No front
    heat-set inserts; no cap self-tappers.
  physical_validation: Not performed. Confirm 4.6mm insert OD; dry-test actual screws/printed
    pilots. No strength or torque qualification.
  insert_reference: https://www.ruthex.de/en/collections/gewindeeinsatze/products/ruthex-gewindeeinsatz-m3-100-stuck-rx-m3x5-7-messing-gewindebuchsen
tibia_inner_selftap:
  baseline: v37
  reason: 'User reports the four inner tibia receiver nuts cannot be installed/accessed,
    then explicitly chooses self-tapping screws instead of inserts. Remove only these
    four nut connections and restore solid plastic behind their original 14mm-PCD
