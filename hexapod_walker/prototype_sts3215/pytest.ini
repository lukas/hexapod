# Prototype-root pytest config (pytest picks the first ini walking up from
# the test paths, so this wins over the repo-root pyproject.toml).
#
# `pythonpath` makes the suite self-sufficient on EVERY runtime — the Mac
# venv (where the editable install already provides these), the CoreWeave
# controller (system Python, `uv run pytest` with UV_NO_PROJECT=1), and any
# fresh worktree. It replaces the per-file `sys.path.insert` blocks the test
# files used to carry:
#   .                      rl_move, hexapod_core, motor_setup packages and the
#                          top-level CAD modules (hexapod_prototype, ...)
#   linux_control          bare-module imports (`import safe_zero`, ...)
#   motor_setup            bare-module imports (`import feetech_bus`, ...)
#   rl_move/orchestrator   bare-module imports (`import tracks`, ...)
#   hexapod-tracker/src    the vision submodule when it is not installed
# Suite-wide env pins live in rl_move/tests/conftest.py.
[pytest]
pythonpath = . linux_control motor_setup rl_move/orchestrator hexapod-tracker/src
