conclusion: >-
  L5 remains measurably looser than L4, but the 2026-09-04 matched all-leg air
  screen shows that it is not uniquely abnormal without ground load. L5
  measured 0.615/0.350 deg hip/knee, while L1 had the largest hip loop at
  0.761 deg and L0 had the largest knee loop at 0.474 deg. The earlier planted
  result still showed substantially more L5 compliance than L4 and was not
  retested across all six legs here. Therefore the current evidence supports
  ordinary cross-leg unloaded backlash plus a still-open possibility of
  load-dependent L5 behavior; it does not support calling L5 the unloaded
  outlier. Absolute stiffness and localization inside the fastener/yoke/link
  stack remain unavailable because force and component-local markers were
  absent.

