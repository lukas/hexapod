        label: "Board standoff region"
        kind: boss_pattern
        purpose: "Mounting region for Arduino Nano and PCA9685 boards."
        render:
          anchor_mm: [0.0, 0.0, 3.0]
    holes: []                            # standoff holes verified by `_verify_prototype` battery-holder check
    wire_channels: []
    keep_out_volumes: []

  coxa_bracket:
    description: "Bolts to chassis edge, holds the yaw servo with output pointing up."
    qty: 6
    bounds_mm: [66.0, 52.0, 45.25]      # = flange_x_extent, BRACKET_FLANGE_Y, BRACKET_FLANGE_T + WELL_H
    features:
      yaw_servo_well:
        label: "Yaw servo well"
        kind: pocket
        purpose: "Holds the yaw servo body with its output shaft pointing upward."
        render:
          anchor_mm: [0.0, 0.0, 26.0]
        dimensions:
          well_height:
            label: "Servo well height"
            value: 45.25
            axis: z
            from_mm: [0.0, 0.0, 0.0]
            to_mm: [0.0, 0.0, 45.25]
      chassis_bolt_pattern:
        label: "Chassis bolt pattern"
        kind: bolt_pattern
        purpose: "Four M3 bolts attach the bracket flange to the chassis."
        render:
          anchor_mm: [-16.0, 0.0, 7.5]
        dimensions:
          x_spacing:
            label: "Bolt X spacing"
            value: 16.0
            axis: x
            from_mm: [-24.0, 20.0, 7.5]
            to_mm: [-8.0, 20.0, 7.5]
          y_spacing:
            label: "Bolt Y spacing"
            value: 40.0
            axis: y
            from_mm: [-8.0, -20.0, 7.5]
            to_mm: [-8.0, 20.0, 7.5]
      yaw_wire_exit:
        label: "Yaw wire exit"
        kind: channel
        purpose: "L-corridor for the yaw servo lead."
        render:
          anchor_mm: [24.0, 20.0, 6.0]
      yaw_horn_keepout:
        label: "Yaw horn sweep keepout"
        kind: keepout
        purpose: "Clearance above the flange for the rotating horn stack."
        render:
          anchor_mm: [0.0, 0.0, 45.25]
    holes:
      - name: chassis_bolt_outboard_NE
        diameter_mm: 3.4
        position_mm: [-8.0, 20.0, 7.5]   # = (-BRACKET_FLANGE_INSET, +BRACKET_BOLT_PCD_Y/2, BRACKET_FLANGE_T/2)
        axis: z
      - name: chassis_bolt_outboard_SE
        diameter_mm: 3.4
        position_mm: [-8.0, -20.0, 7.5]
        axis: z
      - name: chassis_bolt_inboard_NW
        diameter_mm: 3.4
        position_mm: [-24.0, 20.0, 7.5]  # = (-BRACKET_FLANGE_INSET - BRACKET_BOLT_PCD_X, ...)
        axis: z
      - name: chassis_bolt_inboard_SW
        diameter_mm: 3.4
        position_mm: [-24.0, -20.0, 7.5]
        axis: z
    wire_channels:
      - name: yaw_wire_exit_L
        note: "L-corridor at the well's +X bottom-outboard corner; delegated to _verify_prototype.check_wire_slot."
    keep_out_volumes:
      - name: yaw_horn_sweep
        note: "Horn + adapter sweep above the flange; from keepout_volumes.KEEP_OUT_VOLUMES."
      - name: yaw_servo_body
        note: "Yaw-servo body cavity that hangs below the flange."

  coxa_link:
    description: "Yaw-driven flat arm; bottom cap bolts directly to the yaw servo's plastic X-horn, hip-pitch servo well at outboard end."
    qty: 6
    bounds_mm: [61.0, 64.0, 46.0]
    features:
      yaw_horn_pattern:
        label: "Yaw horn bolt pattern"
        kind: bolt_pattern
        purpose: "Four M2 self-tap holes clamp the link to the yaw servo X-horn."
