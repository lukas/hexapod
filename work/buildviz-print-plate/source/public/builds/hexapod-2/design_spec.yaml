        label: "Hip-pitch wire exit"
        kind: channel
        purpose: "L-corridor for the hip-pitch servo lead."
        render:
          anchor_mm: [61.0, 28.0, 6.0]
      link_hub_keepout:
        label: "Link hub horn sweep"
        kind: keepout
        purpose: "Clearance for yaw horn rotation under the link hub."
        render:
          anchor_mm: [0.0, 0.0, 8.0]
    # Design B/D: the four M2 X-horn clamp holes live only in the
    # 4 mm pedestal bottom cap.  Above z=4 mm the body-insertion trough
    # is already open, so the validator probes the cap mid-plane.
    # The central spline screw clearance remains a through-cut up the
    # pedestal/hub stack and is probed at hub mid-thickness.
    holes:
      - name: yaw_horn_bolt_+X
        diameter_mm: 2.2                # = XHORN_BOLT_OD (M2 self-tap, May 2026)
        position_mm: [10.4, 0.0, 2.0]
        axis: z
      - name: yaw_horn_bolt_+Y
        diameter_mm: 2.2
        position_mm: [0.0, 10.4, 2.0]
        axis: z
      - name: yaw_horn_bolt_-X
        diameter_mm: 2.2
        position_mm: [-10.4, 0.0, 2.0]
        axis: z
      - name: yaw_horn_bolt_-Y
        diameter_mm: 2.2
        position_mm: [0.0, -10.4, 2.0]
        axis: z
      - name: yaw_horn_centre
        diameter_mm: 3.4                # = HORN_CENTRE_OD (M3 spline centre screw)
        position_mm: [0.0, 0.0, 36.0]
        axis: z
    wire_channels:
      - name: hip_pitch_wire_exit_L
        note: "L-corridor at the hip-pitch well's +X bottom-outboard corner."
    keep_out_volumes:
